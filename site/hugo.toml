# Hugo configuration for the Ardur landing site.
# TODO: set baseURL to the production domain once it's live.
baseURL = "https://ardurai.dev/"
languageCode = "en-us"
title = "Ardur — Your open-source personal AI agent"
enableRobotsTXT = true

# Single-page landing site; no taxonomies needed.
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[params]
  description = "Open-source personal AI agent that lives in your terminal and your chat apps — with cap-token security, receipt-chain transparency, and cost-tuple awareness built into the wire format."
  repo = "https://github.com/ArdurAI/ardur-agent"
  discussions = "https://github.com/ArdurAI/ardur-agent/discussions"
  # TODO: replace with the real plan-corpus location once published.
  plans = "https://github.com/ArdurAI/ardur-agent"
  runbook = "https://github.com/ArdurAI/ardur-agent/blob/main/RUN.md"
  # TODO: replace with a real sponsor link once set up.
  sponsor = "https://github.com/ArdurAI/ardur-agent"

[markup.goldmark.renderer]
  unsafe = true

[build]
  [build.buildStats]
    enable = true

[minify]
  disableJS = false
  disableCSS = false
  disableHTML = false

[security.node.permissions]
  allowAddons = ["postcss", "tailwindcss"]
  allowChildProcess = ["postcss", "tailwindcss"]
  allowRead = ["."]
  allowWorker = ["postcss", "tailwindcss"]
