# Release supply-chain gate for ARD-309 and #532 P0.
# All native lanes must succeed before any release assets are uploaded.
# Docker image SBOM/Trivy/provenance gates remain in docker.yml.
name: release-supply-chain

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-supply-chain-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.98.1
  RELEASE_TAG: ${{ github.event.release.tag_name }}

defaults:
  run:
    shell: bash

jobs:
  build-release:
    name: release-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Standard public runners, verified against GitHub's hosted-runner docs.
        # macOS is thin, without Developer ID/notarization (owner decision #532).
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target "${TARGET}"
          rustc -vV
          test "$(rustc -vV | awk '/^host:/ {print $2}')" = "${TARGET}"

      - name: Build release binaries
        run: cargo build --workspace --bins --release --locked --target "${TARGET}"

      - name: Package exactly six target binaries
        run: python3 scripts/release_artifacts.py package --tag "${RELEASE_TAG}" --target "${TARGET}"

      - name: Smoke packaged CLI on its native runner
        run: |
          mkdir smoke
          tar -xzf "dist/ardur-${RELEASE_TAG}-${TARGET}.tar.gz" -C smoke
          file smoke/ardur
          ./smoke/ardur --version

      - name: Stage target archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-artifacts:
    name: release-sbom-sign
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Collect all target archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Require the complete archive matrix
        run: python3 scripts/release_artifacts.py check --tag "${RELEASE_TAG}" --stage archives

      # Preserve the existing single release-level workspace SBOM, not one per
      # binary/target. Disable the action's otherwise automatic early upload.
      - name: Generate release SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/ardur-agent-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Require all unsigned release payloads
        run: python3 scripts/release_artifacts.py check --tag "${RELEASE_TAG}" --stage unsigned

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets with keyless cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cd dist
          release_assets=( *.tar.gz *.spdx.json SHA256SUMS )
          for artifact in "${release_assets[@]}"; do
            cosign sign-blob --yes \
              --bundle "${artifact}.bundle" \
              "${artifact}"
          done

      - name: Verify complete signing and checksum parity
        run: |
          python3 scripts/release_artifacts.py check --tag "${RELEASE_TAG}" --stage signed
          cd dist
          sha256sum --check SHA256SUMS
          release_assets=( *.tar.gz *.spdx.json SHA256SUMS )
          for artifact in "${release_assets[@]}"; do
            cosign verify-blob \
              --bundle "${artifact}.bundle" \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${artifact}"
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
