# Builds the Hugo landing site in site/ and publishes it to GitHub Pages.
#
# NOTE: GitHub Pages must be enabled for this repo with "Source: GitHub Actions"
# (Settings -> Pages) before the deploy step can succeed. Until then the hugo
# job still runs and validates the site on every main/dev push and PR.
#
# baseURL: site/hugo.toml currently points at the production domain (ardurai.dev).
# If you deploy to the default *.github.io project path instead, override it with
# `hugo --baseURL "$BASE"` here, or set a CNAME for the custom domain.

name: site-deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Nightly regeneration window (UTC): 02:40, offset from the CI cron to
    # avoid the top-of-hour rush. Catches cross-repo and time-based drift
    # the push trigger cannot see (plan #515 §3).
    - cron: "40 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # actions: read lets the status collector fetch public CI job logs (test
  # totals) with the job token; without it the totals degrade to "not
  # asserted" (review finding on #526).
  actions: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel older in-progress runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.161.1"

jobs:
  hugo:
    name: hugo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          # Hugo's PostCSS step runs node under its permission model (--permission),
          # which is only recognized on Node >= 23. Node 20 rejects it as a bad option.
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install PostCSS / Tailwind deps
        run: npm ci

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Regenerate status data
        # Collects public evidence (GitHub REST surface + the committed
        # workstream-board snapshot) into site/data/progress.json before the
        # Hugo build. Pushes fail loudly on missing sources; PR validations
        # only warn so dependabot PRs (no repo access) don't break the hugo
        # check. GH_TOKEN lets gh use the job token in CI.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${GITHUB_WORKSPACE}" && python3 scripts/site-progress.py --strict
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Generate docs pages
        # Copies the allowlisted repo docs into site/content/docs/ with
        # injected frontmatter (#515 S1). docs/ stays the single source; the
        # copy is generated here, never committed. --check would fail the
        # build on drift, but since the directory is gitignored there is
        # nothing to drift against — generation is unconditional.
        run: python3 "${GITHUB_WORKSPACE}/scripts/site-docs.py"
        working-directory: ${{ github.workspace }}

      - name: Build
        # Pages serves this project under the /ardur-agent/ subpath, so baseURL
        # must include it or every asset link 404s. Override the hugo.toml value
        # (which points at the eventual custom domain) until that domain is live.
        run: hugo --gc --minify --logLevel info --baseURL "https://ardurai.github.io/ardur-agent/"

      - name: Upload Pages artifact
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' ||
          github.event_name == 'schedule'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/public

  deploy:
    # Deploy on pushes to main and on the nightly schedule (the nightly run
    # IS the refresh mechanism for the live page — restricting it to pushes
    # would leave the published data stale; review finding on #526). Never
    # on PRs or dev pushes.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'schedule'
    needs: hugo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
