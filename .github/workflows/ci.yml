# CI for Ardur — the four-stage gauntlet (fmt → clippy → check → test),
# ordered cheapest-first so a formatting failure short-circuits before the
# expensive test compile. Matrix on {ubuntu, macos} × stable. See §0.0.
#
# ARD-423/ARD-309: supply-chain security jobs run cargo-deny (license +
# advisory + ban checks), CodeQL Rust analysis, and dependency review on PRs.
# Docker image SBOM, provenance, and Trivy gates live in docker.yml.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          # cargo-deny-action appends `command` after global `arguments`; the
          # categories must be passed as command-arguments so the action runs:
          #   cargo-deny --workspace check advisories bans licenses sources
          arguments: --workspace
          command-arguments: advisories bans licenses sources

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  codeql-rust:
    name: CodeQL / Rust
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: rust
          build-mode: manual

      - name: Install pinned toolchain components
        run: rustup toolchain install 1.96.1 --profile minimal

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build for CodeQL
        run: cargo check --workspace --all-targets

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:rust"

  gauntlet:
    name: ${{ matrix.os }} / stable
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let a macOS-only failure mask a Linux pass (and vice-versa).
      # Pin macOS instead of using `macos-latest`: GitHub began migrating
      # `macos-latest` from macOS 15 to macOS 26 in June 2026, and the 26 ARM
      # image currently fails this native Rust link path before tests run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pinned toolchain components
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: docs and process unittests
        run: python3 -m unittest discover -s tests

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace
