# CI for Ardur — the four-stage gauntlet (fmt → clippy → check → test),
# ordered cheapest-first so a formatting failure short-circuits before the
# expensive test compile. Matrix on {ubuntu, macos} × stable. See §0.0.
#
# ARD-423: supply-chain security job runs cargo-deny (license + advisory +
# ban checks) against deny.toml on every push and PR.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace check advisories bans licenses sources

  gauntlet:
    name: ${{ matrix.os }} / stable
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let a macOS-only failure mask a Linux pass (and vice-versa).
      # Pin macOS instead of using `macos-latest`: GitHub began migrating
      # `macos-latest` from macOS 15 to macOS 26 in June 2026, and the 26 ARM
      # image currently fails this native Rust link path before tests run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: docs and process unittests
        run: python3 -m unittest discover -s tests

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace
