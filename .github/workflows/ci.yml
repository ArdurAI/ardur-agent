# CI for Ardur — the four-stage gauntlet (fmt → clippy → check → test),
# ordered cheapest-first so a formatting failure short-circuits before the
# expensive test compile. Matrix on {ubuntu, macos} × stable. See §0.0.
#
# ARD-423/ARD-309: supply-chain security jobs run cargo-deny (license +
# advisory + ban checks), CodeQL Rust analysis, and dependency review on PRs.
# Docker image SBOM, provenance, and Trivy gates live in docker.yml.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          # cargo-deny-action appends `command` after global `arguments`; the
          # categories must be passed as command-arguments so the action runs:
          #   cargo-deny --workspace check advisories bans licenses sources
          arguments: --workspace
          command-arguments: advisories bans licenses sources

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql-rust:
    name: CodeQL / Rust
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:rust"

  gauntlet:
    name: ${{ matrix.os }} / stable
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let a macOS-only failure mask a Linux pass (and vice-versa).
      # Pin macOS instead of using `macos-latest`: GitHub began migrating
      # `macos-latest` from macOS 15 to macOS 26 in June 2026, and the 26 ARM
      # image currently fails this native Rust link path before tests run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ubuntu-latest runners ship with ~14 GB free; the ardur workspace
      # (plus the e2e-test target dir) can exhaust that during linking.
      # Free up space before the heavy Rust build starts.
      - name: Free disk space (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm /usr/lib/mono 2>/dev/null || true
          df -h /

      - name: Install pinned toolchain components
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: docs and process unittests
        run: python3 -m unittest discover -s tests

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test
        run: cargo test --workspace --all-features

  dolt-integration:
    # The dolthub adapter's SQL admission gate is built around what `dolt sql -q`
    # actually does with multi-statement input, so its tests drive a real Dolt
    # database. Without `dolt` those tests would early-return and the harness
    # would count them as `passed` — so they are `#[ignore]`d (the same
    # convention as the Qdrant suite above) and this job runs them with
    # `--ignored`, where a missing binary is a hard failure rather than a skip.
    name: dolt integration (--ignored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install dolt
        run: |
          set -euo pipefail
          # Pinned tag, and the asset is a tarball (there is no bare binary
          # asset) — both confirmed against the releases API rather than
          # guessed.
          curl -fsSL -o /tmp/dolt.tar.gz \
            https://github.com/dolthub/dolt/releases/download/v2.3.3/dolt-linux-amd64.tar.gz
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo install -m 0755 /tmp/dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version

      - name: Gated dolt integration tests (--ignored)
        run: cargo test -p ardur-integration-dolthub --test dolthub_sql_gate -- --ignored

  schema-conformance:
    # The ER/MD schemas live in the governance-plane repo, so these tests are
    # `#[ignore]`d in the default run. Plain `cargo test` therefore never
    # executes them, which means a projection could drift out of conformance
    # with CI fully green. This job fetches the schemas and runs them for real.
    name: schema conformance (--ignored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch the governance-plane schemas
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/specs"
          # The schemas are versioned artifacts of the plane repo; a checkout
          # failure must FAIL this job rather than let the tests skip quietly.
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/ArdurAI/ardur.git "$RUNNER_TEMP/plane"
          git -C "$RUNNER_TEMP/plane" sparse-checkout set docs/specs
          cp "$RUNNER_TEMP/plane"/docs/specs/*.schema.json "$RUNNER_TEMP/specs/"
          ls -l "$RUNNER_TEMP/specs"
      - name: ER + MD schema conformance
        env:
          ARDUR_ER_SCHEMA: ${{ runner.temp }}/specs/execution-receipt-v0.1.schema.json
          ARDUR_MD_SCHEMA: ${{ runner.temp }}/specs/mission-declaration-v0.1.schema.json
        run: |
          set -euo pipefail
          # #545: the effect-bucket registry suites validate against the same
          # pinned schemas (class namespace, budget_remaining keys, authored
          # MD budget rules) and must not skip either.
          for suite in schema_conformance effect_schema_conformance; do
            out="$(cargo test -p ardur-governance --test "$suite" -- --ignored --nocapture 2>&1)"
            echo "$out"
            # A skip here would mean the schemas were not found and the job
            # certified nothing — treat it as a failure, not a pass.
            if grep -q "SKIPPED" <<<"$out"; then
              echo "::error::$suite skipped; the schema was not found"
              exit 1
            fi
          done

  qdrant-integration:
    # §7.0 Phase 2: the durable/hybrid Qdrant memory backend needs a live Qdrant,
    # which the gauntlet lacks — so those scenarios are `#[ignore]`d there (they
    # report as `ignored`, never a masked `passed` — see #358). This job boots a
    # real Qdrant and runs them with `--ignored`, so the recall re-entry (#348)
    # and async-drop (#349) fixes are exercised and cannot silently regress.
    name: qdrant integration (--ignored)
    runs-on: ubuntu-latest
    services:
      qdrant:
        # Pin a server whose minor version is within one of the qdrant-client in
        # Cargo.lock (the client refuses a wider skew).
        image: qdrant/qdrant:v1.18.0
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space (ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm /usr/lib/mono 2>/dev/null || true
          df -h /

      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Wait for Qdrant readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:6333/readyz >/dev/null; then
              echo "qdrant ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "qdrant did not become ready" >&2; exit 1

      - name: Gated Qdrant integration tests (--ignored)
        env:
          QDRANT_INTEGRATION_TEST: "1"
          QDRANT_URL: http://localhost:6334
          # Parallel collection provisioning can exceed the production 5s
          # per-RPC deadline. Keep this bounded functional-test budget local
          # to this step; these tests do not prove five-second RPC latency.
          QDRANT_TIMEOUT_SECS: "30"
        run: |
          # Crate-level: durable backend (incl. the async-drop restart path) and
          # hybrid dense+sparse recall over Mock embeddings. The `--skip`ped
          # semantic tests need the BGE model, out of this job's scope.
          cargo test -p ardur-memory-qdrant --test integration -- --ignored
          cargo test -p ardur-memory-qdrant --test hybrid_integration \
            -- --ignored --skip semantic_hit_gated --skip hybrid_beats_either
          # End-to-end through the fused runtime: recall re-entry (#348) and the
          # async-context drop (#349) on the real durable + hybrid backends.
          cargo test -p ardur-e2e-tests \
            --test scenario_qdrant_memory_persistence \
            --test scenario_hybrid_memory_full_pipeline -- --ignored

