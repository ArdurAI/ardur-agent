# Verifies that every commit in a pull request carries a Signed-off-by trailer
# (Developer Certificate of Origin). See CONTRIBUTING.md.
#
# Commits listed in .github/dco-exempt-shas.txt are skipped: these are
# pre-policy or in-flight commits that predate DCO enforcement (see that file).

name: DCO

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  dco:
    name: Check DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on all PR commits
        run: |
          set -uo pipefail

          # Dependabot commits are exempt — the bot cannot sign off.
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            echo "SKIP (dependabot): all commits exempt from DCO"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          EXEMPT_FILE=".github/dco-exempt-shas.txt"

          # Read the exempt list from the BASE ref, never from the PR head.
          # Reading it from the checked-out head would let any PR append its own
          # unsigned SHA and self-exempt (#435). The base copy is the one that
          # already passed review, so an exemption only takes effect after it is
          # merged. A missing file on base means "no exemptions" (fail closed).
          if git cat-file -e "${BASE}:${EXEMPT_FILE}" 2>/dev/null; then
            EXEMPT_RAW="$(git show "${BASE}:${EXEMPT_FILE}")"
          else
            echo "NOTE: ${EXEMPT_FILE} does not exist on the base ref; no commits are exempt."
            EXEMPT_RAW=""
          fi
          EXEMPT="$(printf '%s\n' "${EXEMPT_RAW}" | grep -vE '^[[:space:]]*(#|$)' | awk '{print $1}')"

          # Entries are prefix-matched below, so a short entry would exempt a
          # wide range of commits. The shortest grandfathered entry is 7 chars;
          # refuse anything shorter or not lowercase hex.
          for e in ${EXEMPT}; do
            if ! printf '%s' "${e}" | grep -qE '^[0-9a-f]{7,40}$'; then
              echo "::error::Malformed entry in ${EXEMPT_FILE} on the base ref: '${e}'"
              echo "Entries must be 7-40 lowercase hex characters."
              exit 1
            fi
          done

          # If this PR's own commits touch the exempt file, enforce the
          # documented append-only property and require new entries to be full
          # 40-char SHAs. Existing short entries are grandfathered by the prefix
          # check. The comparison is against the MERGE BASE, not the base tip:
          # a branch that simply has not rebased past a newly-merged exemption
          # has not modified anything and must not be failed for it.
          # This validates the diff only — the list actually applied above still
          # comes from BASE, so a PR cannot exempt its own commits regardless.
          MERGE_BASE="$(git merge-base "${BASE}" "${HEAD}" 2>/dev/null || echo "${BASE}")"

          if git diff --name-only "${MERGE_BASE}" "${HEAD}" -- "${EXEMPT_FILE}" | grep -q .; then
            echo "NOTE: ${EXEMPT_FILE} is modified by this PR; enforcing append-only."

            if git cat-file -e "${MERGE_BASE}:${EXEMPT_FILE}" 2>/dev/null; then
              MB_RAW="$(git show "${MERGE_BASE}:${EXEMPT_FILE}")"
            else
              MB_RAW=""
            fi
            HEAD_RAW="$(git show "${HEAD}:${EXEMPT_FILE}")"

            # Every merge-base line must survive, in order, as a prefix of the
            # head file. Rewriting or deleting a line is a policy change, not an
            # append, and must not pass silently.
            mb_lines="$(printf '%s\n' "${MB_RAW}" | wc -l | tr -d ' ')"
            if [ "$(printf '%s\n' "${HEAD_RAW}" | head -n "${mb_lines}")" \
                 != "$(printf '%s\n' "${MB_RAW}")" ]; then
              echo "::error::${EXEMPT_FILE} is append-only: existing lines may not be modified or removed."
              exit 1
            fi

            # New entries (present on head, absent on the merge base) must be
            # full SHAs.
            NEW_ENTRIES="$(printf '%s\n' "${HEAD_RAW}" | tail -n +"$((mb_lines + 1))" \
                           | grep -vE '^[[:space:]]*(#|$)' | awk '{print $1}')"
            for e in ${NEW_ENTRIES}; do
              if ! printf '%s' "${e}" | grep -qE '^[0-9a-f]{40}$'; then
                echo "::error::New entry '${e}' in ${EXEMPT_FILE} must be a full 40-character commit SHA."
                exit 1
              fi
              echo "NEW EXEMPTION (takes effect once merged, not in this run): ${e}"
            done
          fi

          fail=0
          for sha in $(git rev-list "${BASE}..${HEAD}"); do
            short="${sha:0:7}"

            exempt=0
            for e in ${EXEMPT}; do
              case "${sha}" in
                "${e}"*) exempt=1; break ;;
              esac
            done
            if [ "${exempt}" -eq 1 ]; then
              echo "SKIP (exempt): ${short} $(git show -s --format='%s' "${sha}")"
              continue
            fi

            if git show -s --format='%B' "${sha}" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "OK:            ${short} $(git show -s --format='%s' "${sha}")"
            else
              echo "MISSING:       ${short} $(git show -s --format='%s' "${sha}")"
              fail=1
            fi
          done

          if [ "${fail}" -ne 0 ]; then
            echo ""
            echo "::error::One or more commits are missing a Signed-off-by trailer (DCO)."
            echo "Add one with: git commit --amend -s   (or git rebase --signoff)."
            exit 1
          fi
          echo ""
          echo "All PR commits carry Signed-off-by (or are exempt)."
