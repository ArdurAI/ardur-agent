# Verifies that every commit in a pull request carries a Signed-off-by trailer
# (Developer Certificate of Origin). See CONTRIBUTING.md.
#
# Commits listed in .github/dco-exempt-shas.txt are skipped: these are
# pre-policy or in-flight commits that predate DCO enforcement (see that file).

name: DCO

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  dco:
    name: Check DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on all PR commits
        run: |
          set -uo pipefail

          # Load exempt short-SHAs (drop comments and blank lines, take 1st field).
          EXEMPT="$(grep -vE '^[[:space:]]*(#|$)' .github/dco-exempt-shas.txt | awk '{print $1}')"

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          fail=0
          for sha in $(git rev-list "${BASE}..${HEAD}"); do
            short="${sha:0:7}"

            exempt=0
            for e in ${EXEMPT}; do
              case "${sha}" in
                "${e}"*) exempt=1; break ;;
              esac
            done
            if [ "${exempt}" -eq 1 ]; then
              echo "SKIP (exempt): ${short} $(git show -s --format='%s' "${sha}")"
              continue
            fi

            if git show -s --format='%B' "${sha}" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "OK:            ${short} $(git show -s --format='%s' "${sha}")"
            else
              echo "MISSING:       ${short} $(git show -s --format='%s' "${sha}")"
              fail=1
            fi
          done

          if [ "${fail}" -ne 0 ]; then
            echo ""
            echo "::error::One or more commits are missing a Signed-off-by trailer (DCO)."
            echo "Add one with: git commit --amend -s   (or git rebase --signoff)."
            exit 1
          fi
          echo ""
          echo "All PR commits carry Signed-off-by (or are exempt)."
