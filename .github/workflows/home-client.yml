name: Home client
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  client:
    name: Home client / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build isolated client
        run: cargo build --locked -p home-protocol -p home-client -p ardur-rs
      - name: Guard shipping dependency set
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test-home-packaging.py
          python scripts/test-shipping-set.py
          python scripts/check-shipping-set.py
      - name: Install client into a disposable directory
        shell: bash
        run: cargo install --locked --path crates/ardur-rs --root "${RUNNER_TEMP}/home-client-install"
      - name: Smoke installed client without a paired profile
        shell: bash
        run: |
          binary="${RUNNER_TEMP}/home-client-install/bin/ardur-rs"
          if [ "${RUNNER_OS}" = Windows ]; then binary="${binary}.exe"; fi
          python scripts/home-install-smoke.py "$binary"
      - name: Test disposable home and CLI
        run: cargo test --locked -p home-protocol -p home-client -p ardur-rs -p ardur-eval
      - name: Clippy client
        run: cargo clippy --locked -p home-protocol -p home-client -p ardur-rs -p ardur-eval --all-targets -- -D warnings
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "26.7.0"
      - name: Verify public vectors in Node
        run: node scripts/check-home-vectors.mjs
