# ardur-provider-openrouter — the OpenRouter multi-model gateway backend (§3.2).
#
# OpenRouter (https://openrouter.ai) exposes a single OpenAI-compatible
# `POST /chat/completions` endpoint that routes to many upstream model providers
# behind one API key. This crate is a peer backend to the Anthropic provider
# (§3.1, which currently lives as a module in `ardur-provider-runtime`): it
# implements the same `Provider` trait, so it slots into the generic
# `ProviderRegistry` with no catalog change.
#
# §18.8 keeps this PR scoped to `crates/provider-openrouter/**` plus the E2E
# scenario and the root manifest.

[package]
name = "ardur-provider-openrouter"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The §3.0 provider abstraction this backend implements — the `Provider` trait,
# the request/response/usage envelopes, the `RateCard`, and the typed
# `ProviderError`. We depend on it (one direction); the registry it owns stays
# generic, so wiring OpenRouter in is just `registry.register(Arc::new(..))`.
ardur-provider-runtime = { workspace = true }
# Shared value types the provider call speaks in — `CostTuple` (the billed
# cost), `ProviderId` (the registry key), and `Role` (the prompt turn kind).
ardur-runtime = { workspace = true }
# Retry+backoff+jitter, timeout, and circuit-breaker wrapping the outbound
# HTTP call — the shared resilience layer for external call boundaries.
ardur-resilience = { workspace = true }
# Object-safe async `Provider::complete`.
async-trait = { workspace = true }
# Live OpenRouter HTTP client. rustls-tls matches the Anthropic backend (no
# OpenSSL/native-tls system dependency); `json` carries the serde bodies. The
# `stream` feature unlocks `Response::bytes_stream`, the byte feed the §3.2b SSE
# parser drains the `data: {…}\n\n` chunks from.
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
# Request/response bodies and the retained raw upstream JSON.
serde_json = { workspace = true }
# `Stream`/`StreamExt` for the `stream_chat` return type and `stream::unfold`
# (the stateful SSE-decode loop) / `stream::once` (the connect-error stream).
futures = { workspace = true }

[dev-dependencies]
# The async `complete` calls need a runtime to poll them.
tokio = { workspace = true }
# Stands in for the OpenRouter endpoint so the round-trip is asserted without a
# live API key (matches the workspace's HTTP-mock convention).
wiremock = { workspace = true }
serde_json = { workspace = true }
