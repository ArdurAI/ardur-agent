# ardur-provider-codex — the OpenAI Codex CLI subscription backend (§3.3b).
#
# Unlike the HTTP backends (Anthropic §3.1, OpenRouter §3.2), this provider does
# not call a REST endpoint with an API key. It wraps the locally-installed
# `codex` CLI as a subprocess and runs it non-interactively (`codex exec
# --json`), inheriting the user's logged-in ChatGPT subscription (`codex login`)
# — so dogfooding spends the Plus/Pro/Team plan, not metered API billing. The
# subprocess emits JSONL events on stdout; we parse the final `agent_message`
# and the reported token usage out of that stream.
#
# It implements the same §3.0 `Provider` trait as the HTTP backends, so it slots
# into the generic `ProviderRegistry` with no catalog change.
#
# §18.8 keeps this PR scoped to `crates/provider-codex/**` plus the E2E scenario
# and the root manifest.

[package]
name = "ardur-provider-codex"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The §3.0 provider abstraction this backend implements — the `Provider` trait,
# the request/response/usage envelopes, the `RateCard`, and the typed
# `ProviderError`. One-directional dep; the registry stays generic, so wiring
# Codex in is just `registry.register(Arc::new(..))`.
ardur-provider-runtime = { workspace = true }
# Shared value types the provider call speaks in — `CostTuple` (always zeroed
# cents here: the call is paid by subscription, not per-token), `ProviderId`
# (the registry key), and `Role` (the prompt turn kind).
ardur-runtime = { workspace = true }
# Object-safe async `Provider::complete`.
async-trait = { workspace = true }
# Async subprocess (`tokio::process::Command`) + the wall-clock `timeout` that
# bounds a `codex exec` run. The workspace pins tokio with `features = ["full"]`,
# which covers `process`, `time`, and `io-util`.
tokio = { workspace = true }
# Parsing the JSONL event stream `codex exec --json` writes to stdout, and
# retaining the decoded events as the raw audit body.
serde_json = { workspace = true }

[dev-dependencies]
# The async `complete` calls need a runtime to poll them.
tokio = { workspace = true }
# The subprocess tests write a tiny executable shim that stands in for the real
# `codex` binary (emitting known JSONL / failing on purpose), so the spawn +
# parse round-trip is asserted with no codex install and no subscription spend.
tempfile = { workspace = true }
