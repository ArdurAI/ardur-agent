[package]
name = "home-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
home-protocol = { path = "../home-protocol" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
libc.workspace = true
zeroize = "1"
[dev-dependencies]
tempfile.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
ring = "0.17"
