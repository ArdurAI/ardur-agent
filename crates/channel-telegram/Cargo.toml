# ardur-channel-telegram — a Telegram channel adapter behind the §4.0
# `MessagingGateway` contract (alongside the Slack, Matrix, and Discord
# adapters).
#
# Plan family: §4.Y (Discord + Telegram channel adapters Phase 1). Phase 1 =
# bot-token auth, a `teloxide` long-poll dispatcher whose message endpoint
# forwards inbound text through the gateway, plaintext outbound `send_message`,
# a chat-id allowlist, and self-echo loop prevention (drop a message whose
# sender id is the bot's own user id). Inline keyboards, media, and webhooks are
# later phases.
#
# §18.8 keeps this PR scoped to `crates/channel-telegram/**`, the sibling
# `crates/channel-discord/**`, the boot wiring in `crates/server/**`, the
# cross-crate scenarios in `crates/e2e-tests/**`, the `.env.example` / `RUN.md`
# docs, and the root manifest.

[package]
name = "ardur-channel-telegram"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The §4.0 gateway owns every value type a delivery speaks in — re-use rather
# than redefine so the adapter and the gateway never drift into two schemas.
ardur-messaging-gateway = { workspace = true }
# The teloxide Telegram Bot-API client. Pinned to 0.17 (0.17.0 is the latest as
# of 2026-06; the brief's guessed 0.13 predated several releases). teloxide's
# default features pull `native-tls` (system OpenSSL); we drop defaults and
# select `rustls` so the TLS stack stays pure-Rust — matching the workspace's
# rustls-everywhere stance — and deliberately omit `ctrlc_handler` so the
# embedded dispatcher does not install a SIGINT handler that would race the
# server's own graceful-shutdown signal. See the crate docs' adapt-points note.
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
# `send_message` / `receive` are async trait methods; `async-trait` boxes the
# futures so `TelegramChannel` stays object-safe behind `dyn MessagingGateway`.
async-trait = { workspace = true }
# The dispatcher loop is spawned onto Tokio; the inbound queue is a Tokio mpsc.
# The update-handler tree is built with `teloxide::dptree` (re-exported), so no
# separate dptree dependency is pinned (it would risk a version skew).
tokio = { workspace = true }
# Structured logging for the dispatcher lifecycle and dropped messages.
tracing = { workspace = true }
# `TelegramError` is the crate's typed config/connect/send failure surface.
thiserror = { workspace = true }
# `TelegramError::into_gateway_error` lowers config-time failures onto
# `GatewayError::Internal(#[from] anyhow::Error)`.
anyhow = { workspace = true }
# Mirrors the other adapters: the gateway value types derive serde, and the
# config struct is serde-friendly for callers that load it from a file.
serde = { workspace = true }
# A parsed inbound message is assigned a fresh v4 correlation id.
uuid = { workspace = true, features = ["v4"] }
# The bot token is held as `SecretString` so it never leaks through `Debug`/logs.
secrecy = { workspace = true }

[dev-dependencies]
# The trait methods are async; unit tests that touch them run on a Tokio runtime.
tokio = { workspace = true }
