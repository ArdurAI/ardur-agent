# Workspace root for Ardur.
#
# Phase-0 scaffold (§0.0): a flat `crates/` workspace, one crate per §X.Y
# plan-family. The crates below are contracts-only skeletons — their public
# trait surface is frozen against the owning plan-doc; bodies land in the
# owning plan's Phase 1. See `plans/0.0-workspace-scaffold-blueprint.md`.

[workspace]
resolver = "2"
members = [
    "crates/cap-token",
    "crates/receipt",
    "crates/lifecycle-hooks",
    "crates/cedar-policy",
    "crates/memory",
    "crates/runtime",
    "crates/cost-gate",
    "crates/provider-runtime",
    "crates/cli",
    "crates/messaging-gateway",
    "crates/tool-registry",
    "crates/session-journals",
    "crates/multi-agent",
    "crates/injection-defense",
    "crates/fused-runtime",
    "crates/slack-adapter",
    "crates/server",
    "crates/e2e-tests",
]

[workspace.package]
edition = "2024"
# Edition 2024 stabilized in Rust 1.85, so the MSRV floor is 1.85 (R-2
# reconciliation in §0.0 — the seed's 1.83 predated the edition-2024 bump).
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ArdurAI/ardur-agent"

[workspace.dependencies]
# --- External crates (pinned at the workspace level; crates opt in with
#     `{ workspace = true }` so versions stay uniform). ---
# Cap-tokens — Biscuit issuance + attenuation (crates/cap-token, §11.14).
biscuit-auth = "5"
# Cedar policy engine — wrapped by crates/cedar-policy (§11.0).
cedar-policy = "4.11"
# Bi-temporal time for crates/memory (§7.0).
chrono = { version = "0.4", features = ["serde"] }
# JWS-ES256 receipt signing for crates/receipt (§11.14). Built directly on
# p256 (ECDSA P-256 + SHA-256) rather than a JWT facade: the receipt crate
# needs the raw EC `x`/`y` affine coordinates to publish JWKS keys and to
# reconstruct verifying keys offline (ADR-Phase3-549). `pem` enables the
# PKCS#8 PEM round-trip for key custody; `rand_core`'s `getrandom` backs
# `Es256SigningKey::generate`.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
# Slack signing-secret verification (crates/slack-adapter, §4.1): HMAC-SHA256
# over the request basestring, hex-encoded, compared in constant time. `hmac`
# pairs with the workspace `sha2`; `subtle` is the constant-time eq; `hex`
# encodes the digest to Slack's `v0=...` wire form.
hmac = "0.12"
subtle = "2"
hex = "0.4"
# Secret custody for the Slack bot token + signing secret (crates/slack-adapter,
# §4.1) — keeps them out of Debug/log output behind `SecretString`.
secrecy = "0.8"
base64 = "0.22"
regex = "1"
once_cell = "1"
# HTTP client for the live provider backends (crates/provider-runtime, §3.1).
# `rustls-tls` keeps the TLS stack pure-Rust — no OpenSSL/native-tls system
# dependency; `json` pulls the serde request/response helpers.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime (crates/runtime, §1.0).
tokio = { version = "1", features = ["full"] }
# HTTP server framework backing the `ardur-server` binary (crates/server): the
# Slack Events-API webhook listener + `/healthz`. `tower` supplies the
# `ServiceExt::oneshot` the router is driven through in-process by the server's
# integration tests (no real listener needed).
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
# Tracing & observability.
tracing = "0.1"
# Error handling.
anyhow = "1"
thiserror = "2"
# Stable IDs (UUIDv7 — time-ordered) for runtime turn/session ids.
uuid = { version = "1", features = ["v7", "serde"] }
# Non-poisoning sync primitives for the in-process memory store (crates/memory, §7.0).
parking_lot = "0.12"
# Async trait methods — object-safe `Provider` trait (crates/provider-runtime,
# §3.0) and the cost-admission gate + budget store (crates/cost-gate, §11.14).
async-trait = "0.1"
# CLI argument parsing — the `ardur` binary's subcommands (crates/cli, §2.1).
clap = { version = "4", features = ["derive"] }
# Tracing subscriber — the CLI installs the process-wide log formatter (§2.1).
tracing-subscriber = "0.3"
# Interactive line editor backing the chat REPL (crates/cli, §2.1).
rustyline = "18"
# Black-box CLI assertions — drives the built `ardur` binary in integration
# tests (crates/cli dev-dependency, §2.1).
assert_cmd = "2"
# Throwaway directories for the file-backed session-journal tests
# (crates/session-journals dev-dependency, §7.10).
tempfile = "3"
# HTTP mock server — stands in for `chat.postMessage` so the Slack adapter's
# outbound POST is asserted without a live workspace (crates/slack-adapter +
# crates/e2e-tests dev-dependency, §4.1).
wiremock = "0.6"
# Concurrent future joining — `join_all` drives the multi-agent parallel-asks
# test without spawning (the `?Send` runtime cannot move across threads)
# (crates/multi-agent dev-dependency, §5.0).
futures = "0.3"

# --- Internal crate path-deps (one per Phase-0 crate). Declared here so
#     cross-crate wiring in Phase 1 references `{ workspace = true }`. ---
ardur-cap-token = { path = "crates/cap-token" }
ardur-receipt = { path = "crates/receipt" }
ardur-lifecycle-hooks = { path = "crates/lifecycle-hooks" }
ardur-cedar-policy = { path = "crates/cedar-policy" }
ardur-memory = { path = "crates/memory" }
ardur-runtime = { path = "crates/runtime" }
ardur-cost-gate = { path = "crates/cost-gate" }
ardur-provider-runtime = { path = "crates/provider-runtime" }
ardur-messaging-gateway = { path = "crates/messaging-gateway" }
ardur-tool-registry = { path = "crates/tool-registry" }
ardur-session-journals = { path = "crates/session-journals" }
ardur-multi-agent = { path = "crates/multi-agent" }
ardur-injection-defense = { path = "crates/injection-defense" }
ardur-fused-runtime = { path = "crates/fused-runtime" }
ardur-slack-adapter = { path = "crates/slack-adapter" }
ardur-server = { path = "crates/server" }
