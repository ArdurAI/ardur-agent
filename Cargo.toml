# Workspace root for Ardur.
#
# Phase-0 scaffold (§0.0): a flat `crates/` workspace, one crate per §X.Y
# plan-family. The crates below are contracts-only skeletons — their public
# trait surface is frozen against the owning plan-doc; bodies land in the
# owning plan's Phase 1. See `plans/0.0-workspace-scaffold-blueprint.md`.

[workspace]
resolver = "2"
members = [
    "crates/acp",
    "crates/approvals",
    "crates/core-types",
    "crates/cap-token",
    "crates/embeddings",
    "crates/bm25-index",
    "crates/fusion",
    "crates/receipt",
    "crates/lifecycle-hooks",
    "crates/hooks-openclaw-compat",
    "crates/cedar-policy",
    "crates/memory",
    "crates/memory-qdrant",
    "crates/runtime",
    "crates/automation",
    "crates/cron",
    "crates/cron-ui",
    "crates/standing-goals",
    "crates/cost-gate",
    "crates/provider-runtime",
    "crates/media-decode",
    "crates/media-audio",
    "crates/media-video",
    "crates/provider-openrouter",
    "crates/provider-openai-compat",
    "crates/provider-ollama",
    "crates/provider-codex",
    "crates/provider-claude-cli",
    "crates/provider-selector",
    "crates/cli",
    "crates/messaging-gateway",
    "crates/tool-registry",
    "crates/session-journals",
    "crates/multi-agent",
    "crates/loop-detector",
    "crates/injection-defense",
    "crates/plugin-runtime",
    "crates/fused-runtime",
    "crates/slack-adapter",
    "crates/channel-matrix",
    "crates/channel-discord",
    "crates/channel-telegram",
    "crates/channel-email",
    "crates/web-pwa",
    "crates/server",
    "crates/admin-ui",
    "crates/e2e-tests",
    "crates/eval-harness",
    "crates/memory-eval",
    "crates/browser",
    "crates/terminal",
    "crates/web",
    "crates/webhook",
    "crates/config",
    "crates/health",
    "crates/logs",
    "crates/resilience",
]

[workspace.package]
edition = "2024"
# Edition 2024 stabilized in Rust 1.85, but that is NOT a verified MSRV
# floor for this workspace: `cargo +1.85.0 check --workspace` fails outright
# against several transitive dependencies (matrix-sdk-common needs 1.93,
# ruma 1.89, tonic 1.88, tantivy 1.86, ...) — confirmed 2026-07-12 (deep code
# review finding M11). `rust-version` is left at the edition floor as a
# lower bound only; nothing in CI gates against it (ci.yml's `gauntlet` job
# installs 1.96.1). Raising it to the real floor is a larger, separate
# change: clippy's MSRV-aware lints (e.g. let-chain collapsing) start firing
# differently the moment `rust-version` moves, which touches unrelated code
# across ~20 files — out of scope here.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ArdurAI/ardur-agent"

[workspace.dependencies]
# --- External crates (pinned at the workspace level; crates opt in with
#     `{ workspace = true }` so versions stay uniform). ---
# Cap-tokens — Biscuit issuance + attenuation (crates/cap-token, §11.14).
biscuit-auth = "6"
# Cedar policy engine — wrapped by crates/cedar-policy (§11.0).
cedar-policy = "4.11"
# Bi-temporal time for crates/memory (§7.0).
chrono = { version = "0.4", features = ["serde"] }
# JWS-ES256 receipt signing for crates/receipt (§11.14). Built directly on
# p256 (ECDSA P-256 + SHA-256) rather than a JWT facade: the receipt crate
# needs the raw EC `x`/`y` affine coordinates to publish JWKS keys and to
# reconstruct verifying keys offline (ADR-Phase3-549). `pem` enables the
# PKCS#8 PEM round-trip for key custody; `rand_core`'s `getrandom` backs
# `Es256SigningKey::generate`.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
# Slack signing-secret verification (crates/slack-adapter, §4.1): HMAC-SHA256
# over the request basestring, hex-encoded, compared in constant time. `hmac`
# pairs with the workspace `sha2`; `subtle` is the constant-time eq; `hex`
# encodes the digest to Slack's `v0=...` wire form.
hmac = "0.13"
subtle = "2"
hex = "0.4"
# Secret custody for the Slack bot token + signing secret (crates/slack-adapter,
# §4.1) — keeps them out of Debug/log output behind `SecretString`.
secrecy = "0.10"
base64 = "0.22"
# Race-resistant Unix opens for private state and exported session bundles.
libc = "0.2"
# Descriptor-relative directory traversal for journal paths; prevents parent
# symlink substitution between validation and open.
rustix = { version = "1.1", features = ["fs"] }
regex = "1"
once_cell = "1"
# HTTP client for the live provider backends (crates/provider-runtime, §3.1).
# `rustls-tls` keeps the TLS stack pure-Rust — no OpenSSL/native-tls system
# dependency; `json` pulls the serde request/response helpers; `stream`
# exposes `Response::bytes_stream()`, used by crates/terminal's ModalBackend
# to bound response-body reads instead of buffering an unbounded body before
# parsing it.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
ignore = "0.4"
cargo-lock = "11.0"
# URL parsing + host classification for the §6.2 built-in `http.fetch` tool
# (crates/tool-registry): rejects relative/non-http(s) URLs and exposes the
# host as a typed `Host` (domain vs IP literal) for the SSRF allowlist + IP
# checks. Already in the lockfile via reqwest's transitive use.
url = "2"
# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Direct protobuf decoding for signed Biscuit block introspection in cap-token.
prost = "0.10"
# YAML frontmatter parsing for filesystem SKILL.md skills (crates/tool-registry,
# §8.X). serde_yaml is archived upstream but remains the de-facto serde YAML
# deserializer; the frontmatter parsed here is small, trusted, author-authored.
serde_yaml = "0.9"
# Async runtime (crates/runtime, §1.0).
tokio = { version = "1", features = ["full"] }
# HTTP server framework backing the `ardur-server` binary (crates/server): the
# Slack Events-API webhook listener + `/healthz`. `tower` supplies the
# `ServiceExt::oneshot` the router is driven through in-process by the server's
# integration tests (no real listener needed).
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
# Compile-time HTML templating for the `ardur-admin` observability dashboard
# (crates/admin-ui, §13.X). maud renders HTML from a Rust macro — no template
# files, no runtime template engine, a single proc-macro dependency — and its
# `axum` feature makes `Markup` an `IntoResponse` directly. Chosen over askama
# (needs a templates dir + build step) and tera (a runtime engine, explicitly
# excluded) because it is the lightest server-rendering option for a read-only
# dashboard.
maud = { version = "0.27", features = ["axum"] }
# In-process axum test harness — `axum-test::TestServer` drives the admin-ui
# router without binding a port, backing the endpoint integration tests
# (crates/admin-ui dev-dependency, §13.X).
axum-test = "21"
# Tracing & observability.
tracing = "0.1"
# OpenTelemetry GenAI semantic-convention emission (crates/provider-runtime
# `telemetry`). The provider-dispatch span carries `gen_ai.*` attributes; an
# OTLP exporter ships them to any OTLP-native backend — Langfuse / Phoenix /
# Arize / Jaeger — "for free". Keep the OTel crates and tracing bridge on a
# verified-compatible set so trait types do not split across crate versions.
# default-features are stripped so we pull only the trace signal — no
# metrics/logs pipelines we don't emit.
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.33"
# Error handling.
anyhow = "1"
thiserror = "2"
# Stable IDs (UUIDv7 — time-ordered) for runtime turn/session ids.
uuid = { version = "1", features = ["v7", "serde"] }
# Non-poisoning sync primitives for the in-process memory store (crates/memory, §7.0).
parking_lot = "0.12"
# Qdrant gRPC client backing the durable memory store (crates/memory-qdrant, §7.0
# Phase 2). Pinned to the 1.18 line, matching the Qdrant server release track.
qdrant-client = "1.18"
# Async trait methods — object-safe `Provider` trait (crates/provider-runtime,
# §3.0) and the cost-admission gate + budget store (crates/cost-gate, §11.14).
async-trait = "0.1"
# CLI argument parsing — the `ardur` binary's subcommands (crates/cli, §2.1).
clap = { version = "4", features = ["derive", "env"] }
# Tracing subscriber — the CLI installs the process-wide log formatter (§2.1).
tracing-subscriber = "0.3"
# Interactive line editor backing the chat REPL (crates/cli, §2.1).
rustyline = "18"
# §2.X stunning-CLI rendering core (crates/cli, ADR-Phase2-021). CommonMark
# parser — we walk comrak's AST and render to our *own* styled terminal spans
# (not its HTML/ANSI formatters), so `default-features = false` drops the CLI,
# xdg, syntect-bridge, and shortcode features we don't use and keeps just the
# parser + node arena.
comrak = { version = "0.54", default-features = false }
# Syntax highlighting for fenced code blocks. `regex-fancy` is the pure-Rust
# regex engine (avoids the `onig` C dependency in CI); `default-syntaxes` +
# `default-themes` bundle the Sublime grammars + themes we map languages and
# light/dark palettes onto. Prior art: Codex CLI ships syntect highlighting.
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
# Terminal capability probing for the rendering core — `terminal::size()` for
# width-adaptive boxes/tables. `default-features = false` drops the event reader
# and Windows bracketed-paste machinery (Phase 2's TUI opts those back in).
crossterm = { version = "0.29", default-features = false }
# Black-box CLI assertions — drives the built `ardur` binary in integration
# tests (crates/cli dev-dependency, §2.1).
assert_cmd = "2"
# `assert_cmd`'s stdout/stderr predicate matchers (crates/cli dev-dependency).
predicates = "3"
# Serial test execution for env-mutating integration tests — prevents races
# on process-global environment variables (crates/server, crates/provider-selector
# dev-dependency).
serial_test = "3"
# Throwaway directories for the file-backed session-journal tests
# (crates/session-journals dev-dependency, §7.10).
tempfile = "3"
# HTTP mock server — stands in for `chat.postMessage` so the Slack adapter's
# outbound POST is asserted without a live workspace (crates/slack-adapter +
# crates/e2e-tests dev-dependency, §4.1).
wiremock = "0.6"
# Concurrent future joining — `join_all` drives the multi-agent parallel-asks
# test without spawning (the `?Send` runtime cannot move across threads)
# (crates/multi-agent dev-dependency, §5.0).
futures = "0.3"
# Official Model Context Protocol Rust SDK (§6.0 Phase 2). The tool-registry
# bridges its `ToolRegistry` to MCP — `server` for the `ServerHandler` that
# exposes local tools, `client` + `transport-streamable-http-client-reqwest`
# for the `RemoteMcpToolset` that consumes remote ones, and
# `transport-streamable-http-server` for the axum-mounted Streamable-HTTP
# service in `crates/server`. Pinned here so both crates share one version.
# Held at 2.0.0 (see dependabot.yml ignore + #237): 2.2.0 calls
# `SseStream::from_bytes_stream`, which the `sse-stream` version in our lock
# (0.2.3, exposing only `from_byte_stream`) doesn't have — E0599 on every
# platform. Unpin once `sse-stream` ships the renamed method.
rmcp = { version = "=2.0.0", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
# Docker daemon API for terminal Docker exec backend (ARD-315/ARD-324).
bollard = "0.21"
# Jitter for the shared resilience layer's retry/backoff (crates/resilience).
# Plain `rand`, not `rand_core` alone, because jitter needs a full RNG
# (`random_range`) rather than the raw byte-fill trait rand_core exposes.
# Pinned to 0.10 to match `crates/cli`'s existing direct `rand = "0.10"` dep
# (#265) — one version in the tree, no cargo-deny duplicate-version warning.
rand = "0.10"
# SSH client library for terminal SSH remote backend (ARD-315/ARD-324). Disable
# russh's default `rsa` feature because upstream rsa has an unfixed Marvin timing
# side-channel advisory (RUSTSEC-2023-0071); keep compression and aws-lc crypto.
russh = { version = "0.62", default-features = false, features = ["flate2", "aws-lc-rs"] }

# --- Internal crate path-deps (one per Phase-0 crate). Declared here so
