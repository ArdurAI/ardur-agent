[workspace]
resolver = "2"
members = [ "crates/acp", "crates/approvals", "crates/core-types", "crates/cap-token", "crates/embeddings", "crates/bm25-index", "crates/fusion", "crates/receipt", "crates/lifecycle-hooks", "crates/hooks-openclaw-compat", "crates/cedar-policy", "crates/memory", "crates/memory-qdrant", "crates/runtime", "crates/automation", "crates/cron", "crates/cron-ui", "crates/standing-goals", "crates/cost-gate", "crates/provider-runtime", "crates/media-decode", "crates/media-audio", "crates/media-video", "crates/provider-openrouter", "crates/provider-openai-compat", "crates/provider-ollama", "crates/provider-codex", "crates/provider-claude-cli", "crates/provider-selector", "crates/cli", "crates/messaging-gateway", "crates/tool-registry", "crates/session-journals", "crates/multi-agent", "crates/delegate-tool", "crates/injection-defense", "crates/plugin-runtime", "crates/fused-runtime", "crates/slack-adapter", "crates/channel-matrix", "crates/channel-discord", "crates/channel-telegram", "crates/server", "crates/admin-ui", "crates/e2e-tests", "crates/eval-harness", "crates/memory-eval", "crates/browser", "crates/terminal", "crates/web", "crates/webhook", "crates/config", "crates/health", "crates/logs", "crates/resilience", "crates/durability", "crates/benches", "crates/code-execution",]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ArdurAI/ardur-agent"

[workspace.dependencies]
biscuit-auth = "6"
cedar-policy = "4.11"
sha2 = "0.11"
hmac = "0.13"
subtle = "2"
hex = "0.4"
secrecy = "0.10"
base64 = "0.23"
# Race-resistant Unix opens for private state and exported session bundles.
libc = "0.2"
regex = "1"
once_cell = "1"
ignore = "0.4"
cargo-lock = "11.0"
url = "2"
serde_json = "1"
prost = "0.10"
serde_yaml = "0.9"
tar = "0.4"
flate2 = "1"
axum = "0.8"
axum-test = "21"
tracing = "0.1"
tracing-opentelemetry = "0.33"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
qdrant-client = "1.18"
async-trait = "0.1"
tracing-subscriber = "0.3"
rustyline = "18"
assert_cmd = "2"
predicates = "3"
serial_test = "4"
tempfile = "3"
wiremock = "0.6"
futures = "0.3"
bollard = "0.21"
rand = "0.10"

[workspace.dependencies.chrono]
version = "0.4"
features = [ "serde",]

[workspace.dependencies.p256]
version = "0.13"
features = [ "ecdsa", "pkcs8", "pem",]

[workspace.dependencies.rand_core]
version = "0.6"
features = [ "getrandom",]

[workspace.dependencies.rustix]
version = "1.1"
features = [ "fs",]

[workspace.dependencies.reqwest]
version = "0.12"
default-features = false
features = [ "json", "multipart", "rustls-tls", "stream",]

[workspace.dependencies.serde]
version = "1"
features = [ "derive",]

[workspace.dependencies.tokio]
version = "1"
features = [ "full",]

[workspace.dependencies.tower]
version = "0.5"
features = [ "util",]

[workspace.dependencies.maud]
version = "0.27"
features = [ "axum",]

[workspace.dependencies.opentelemetry]
version = "0.32"
default-features = false
features = [ "trace",]

[workspace.dependencies.opentelemetry_sdk]
version = "0.32.1"
default-features = false
features = [ "rt-tokio", "trace",]

[workspace.dependencies.opentelemetry-otlp]
version = "0.32"
default-features = false
features = [ "grpc-tonic", "trace",]

[workspace.dependencies.uuid]
version = "1"
features = [ "v7", "serde",]

[workspace.dependencies.clap]
version = "4"
features = [ "derive", "env",]

[workspace.dependencies.comrak]
version = "0.54"
default-features = false

[workspace.dependencies.syntect]
version = "5.3"
default-features = false
features = [ "parsing", "default-syntaxes", "default-themes", "regex-fancy",]

[workspace.dependencies.crossterm]
version = "0.29"
default-features = false

[workspace.dependencies.rmcp]
version = "=2.0.0"
default-features = false
features = [ "server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest",]

[workspace.dependencies.russh]
version = "0.62"
default-features = false
features = [ "flate2", "aws-lc-rs",]

[workspace.dependencies.ardur-core-types]
path = "crates/core-types"

[workspace.dependencies.ardur-cap-token]
path = "crates/cap-token"

[workspace.dependencies.ardur-approvals]
path = "crates/approvals"

